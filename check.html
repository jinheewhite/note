<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>판서노트 — 기기 진단</title>
<style>
  body{margin:0;background:#141d26;color:#e8eef4;padding:20px 16px;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:17px;line-height:1.6}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:#8fa3b5;font-size:15px;margin:0 0 20px}
  .verdict{border-radius:12px;padding:18px 20px;margin:0 0 20px;font-size:20px;font-weight:800}
  .v-ok{background:#1c3326;border:2px solid #3fa96a;color:#7fe0a4}
  .v-bad{background:#3a1f22;border:2px solid #c0504d;color:#ff9d99}
  .v-warn{background:#3a3320;border:2px solid #c9a227;color:#f5d547}
  .verdict small{display:block;font-size:15px;font-weight:400;margin-top:8px;opacity:.85}
  table{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:15px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #2b3b4c}
  th{color:#8fa3b5;font-weight:600;width:42%}
  .y{color:#7fe0a4;font-weight:700}
  .n{color:#ff9d99;font-weight:700}
  h2{font-size:17px;margin:24px 0 8px;color:#8fa3b5}
  #ua{background:#1e2b38;border:1px solid #3d5165;border-radius:10px;padding:12px;
    font-size:13px;line-height:1.6;word-break:break-all;color:#b9c9d8}
  .hint{color:#8fa3b5;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>판서노트 기기 진단</h1>
  <p class="sub">이 화면을 그대로 사진 찍어 보내 주세요.</p>
  <div id="verdict" class="verdict v-warn">검사 중…</div>
  <h2>기기</h2>
  <table id="dev"></table>
  <h2>문법 검사 <span style="font-weight:400;color:#8fa3b5">— 하나라도 ✗ 면 앱이 통째로 안 뜹니다</span></h2>
  <table id="syn"></table>
  <h2>기능 검사</h2>
  <table id="feat"></table>
  <h2>브라우저 정보 원문</h2>
  <div id="ua"></div>
  <p class="hint">주소: jinheewhite.github.io/note/check.html</p>
</div>
<script>
/* 이 파일은 일부러 옛날 문법(ES5)으로만 만들었습니다.
   아주 낡은 브라우저에서도 반드시 실행되어야 진단이 되기 때문입니다. */
(function(){
  var ua = navigator.userAgent;

  function row(tbl, label, value, cls){
    var tr = document.createElement('tr');
    var th = document.createElement('th'); th.appendChild(document.createTextNode(label));
    var td = document.createElement('td');
    if (cls) td.className = cls;
    td.appendChild(document.createTextNode(value));
    tr.appendChild(th); tr.appendChild(td);
    document.getElementById(tbl).appendChild(tr);
  }

  /* 문법 지원 여부는 eval 로만 확인할 수 있습니다.
     본문에 직접 쓰면 이 파일 자체가 파싱되지 않기 때문입니다. */
  function synOK(code){
    try { new Function(code); return true; } catch (e) { return false; }
  }
  function runOK(fn){
    try { return !!fn(); } catch (e) { return false; }
  }

  var m, chrome = 0, android = '';
  m = ua.match(/Chrome\/(\d+)/);       if (m) chrome = parseInt(m[1], 10);
  m = ua.match(/Android\s+([\d.]+)/);  if (m) android = m[1];

  row('dev', '크롬 버전', chrome ? chrome : '크롬 아님/알 수 없음');
  row('dev', '안드로이드 버전', android ? android : '안드로이드 아님');
  row('dev', 'WebView 로 열림', ua.indexOf('wv') >= 0 ? '예 (앱 내장 브라우저)' : '아니오 (크롬 앱)');
  row('dev', '화면 크기', screen.width + ' × ' + screen.height);
  row('dev', '화면 배율', (window.devicePixelRatio || 1));
  row('dev', '기기 메모리', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '알 수 없음');
  row('dev', 'CPU 코어', navigator.hardwareConcurrency || '알 수 없음');

  var syntax = [
    ['?. 옵셔널 체이닝',  'var o={};return o?.a;',            'Chrome 80'],
    ['?? 널 병합',        'return null ?? 1;',                'Chrome 80'],
    ['#private 필드',     'class A{#x=1;get(){return this.#x}}','Chrome 74'],
    ['클래스 필드',        'class A{x=1}',                     'Chrome 72'],
    ['async / await',     'return (async function(){})();',   'Chrome 55'],
    ['화살표 함수',        'return (()=>1)();',                'Chrome 45']
  ];
  var synFail = 0, i, ok;
  for (i = 0; i < syntax.length; i++) {
    ok = synOK(syntax[i][1]);
    if (!ok) synFail++;
    row('syn', syntax[i][0] + '  (' + syntax[i][2] + '+)', ok ? '✓ 됨' : '✗ 안 됨', ok ? 'y' : 'n');
  }

  var feats = [
    ['Array.at()',        function(){ return [1].at(0) === 1; },              'Chrome 92'],
    ['structuredClone',   function(){ return typeof structuredClone === 'function'; }, 'Chrome 98'],
    ['서비스워커 (설치용)', function(){ return 'serviceWorker' in navigator; },  'Chrome 45'],
    ['Blob 워커',          function(){ return typeof Worker === 'function' && typeof URL.createObjectURL === 'function'; }, 'Chrome 20'],
    ['OffscreenCanvas',   function(){ return typeof OffscreenCanvas === 'function'; }, 'Chrome 69'],
    ['ResizeObserver',    function(){ return typeof ResizeObserver === 'function'; },  'Chrome 64'],
    ['IndexedDB (저장용)', function(){ return !!window.indexedDB; },            'Chrome 24'],
    ['localStorage',      function(){ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }, 'Chrome 4'],
    ['포인터 이벤트 (필기)', function(){ return !!window.PointerEvent; },        'Chrome 55'],
    ['폴더 저장 지정',      function(){ return typeof window.showDirectoryPicker === 'function'; }, '데스크톱 전용'],
    ['파일 저장 대화상자',   function(){ return typeof window.showSaveFilePicker === 'function'; },  '데스크톱 전용']
  ];
  var featFail = 0;
  for (i = 0; i < feats.length; i++) {
    ok = runOK(feats[i][1]);
    if (!ok) featFail++;
    row('feat', feats[i][0] + '  (' + feats[i][2] + '+)', ok ? '✓ 됨' : '✗ 안 됨', ok ? 'y' : 'n');
  }

  document.getElementById('ua').appendChild(document.createTextNode(ua));

  var v = document.getElementById('verdict'), msg, cls;
  if (synFail > 0) {
    cls = 'v-bad';
    msg = '이 기기에서는 판서노트가 아예 뜨지 않습니다.';
    msg += '\n문법 ' + synFail + '가지를 지원하지 않아 앱 코드 전체가 실행되지 못합니다.';
    msg += ' pdf.js 를 옛 문법 빌드로 바꾸고 본체 문법도 낮춰야 합니다.';
  } else if (featFail > 0 && (!runOK(function(){ return [1].at(0) === 1; }) || typeof structuredClone !== 'function')) {
    cls = 'v-warn';
    msg = '문법은 통과했지만 일부 기능이 없습니다.';
    msg += '\n폴리필 몇 줄만 넣으면 해결됩니다. 큰 공사는 아닙니다.';
  } else {
    cls = 'v-ok';
    msg = '이 기기는 판서노트를 돌릴 수 있습니다.';
    msg += '\n앱이 무겁거나 안 열린다면 문법 문제가 아니라 성능·용량 문제입니다.';
  }
  v.className = 'verdict ' + cls;
  var parts = msg.split('\n');
  v.innerHTML = '';
  v.appendChild(document.createTextNode(parts[0]));
  if (parts[1]) { var s = document.createElement('small'); s.appendChild(document.createTextNode(parts[1])); v.appendChild(s); }
})();
</script>
</body>
</html>
